name: Daily AI Free Deals Sync

on:
  schedule:
    - cron: '30 0 * * *' # 每日北京时间 08:30 自动更新
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync latest AI free deals from Xianrenbing
        run: node scripts/sync-deals.mjs

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md archive/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          DATE_STR=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          git commit -m "chore(daily): update AI free deals for ${DATE_STR}"
          git push
